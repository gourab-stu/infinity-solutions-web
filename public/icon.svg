<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect x="32" y="32" width="448" height="448" rx="88" fill="url(#brandGrad)" />
  
  <!-- Outer Stroke subtle border -->
  <rect x="32" y="32" width="448" height="448" rx="88" fill="none" stroke="#34d399" stroke-width="6" opacity="0.4" />
  
  <!-- Heartbeat ECG Pulse Path matching Activity icon from Lucide -->
  <path 
    d="M 80 256 L 160 256 L 205 130 L 265 382 L 320 200 L 355 256 L 432 256" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="36" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#shadow)"
  />
  
  <!-- Center Accent Point / Indicator -->
  <circle cx="205" cy="130" r="10" fill="#ffffff" opacity="0.9" />
  <circle cx="265" cy="382" r="10" fill="#ffffff" opacity="0.9" />
</svg>
